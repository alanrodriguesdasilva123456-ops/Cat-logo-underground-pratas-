<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underground Pratas 925 - Catálogo Oficial</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #181920;
            --card-border: #2a2b36;
            --text-primary: #ffffff;
            --text-secondary: #a0a5b5;
            --accent-green: #00e676;
            --accent-hover: #00c853;
            --button-bg: #282a36;
            --button-hover: #343746;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            padding: 30px 15px 20px;
            background: linear-gradient(180deg, rgba(20,21,28,1) 0%, rgba(15,16,21,1) 100%);
            border-bottom: 1px solid var(--card-border);
        }

        header h1 {
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 800;
        }

        header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .category-title {
            max-width: 1000px;
            margin: 25px auto 10px;
            padding: 0 15px;
            font-size: 18px;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid var(--accent-green);
            padding-left: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        @media (min-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }
        }

        @media (min-width: 900px) {
            .grid-container {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .product-image-container {
            position: relative;
            width: 100%;
            padding-top: 100%;
            background-color: #222;
            overflow: hidden;
        }

        .product-image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 13px;
            line-height: 1.3;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 500;
            height: 34px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 10px;
        }

        .btn {
            width: 100%;
            padding: 9px 0;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
        }

        .btn-add {
            background-color: var(--button-bg);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
        }

        .btn-consult {
            background-color: var(--accent-green);
            color: #000;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(24, 25, 32, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--card-border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .cart-info {
            display: flex;
            flex-direction: column;
        }

        .cart-count {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .cart-total {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-green);
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>UNDERGROUND PRATAS</h1>
        <p>Prata 925 Legítima</p>
    </header>

    <div class="category-title">Anéis (001 a 156)</div>
    <div class="grid-container" id="grid-aneis"></div>

    <div class="category-title">Argolas (157 em diante)</div>
    <div class="grid-container" id="grid-argolas"></div>

    <div class="cart-bar">
        <div class="cart-info">
            <span class="cart-count" id="cart-count">0 itens selecionados</span>
            <span class="cart-total" id="cart-total">R$ 0,00</span>
        </div>
        <a href="#" class="btn-whatsapp" id="whatsapp-btn" onclick="sendOrder(event)">
            Enviar Pedido 💬
        </a>
    </div>

    <script>
        const WHATSAPP_PHONE = "5561999999999"; 

        const productsAneis = [];
        const productsArgolas = [
            { id: 157, name: "Argola Fio Quadrado 1,5 mm", price: 60.00, image: "https://via.placeholder.com/400?text=Argola+157" },
            { id: 158, name: "Argola Coração Fio Chanfrado 1,5 cm", price: 65.00, image: "https://via.placeholder.com/400?text=Argola+158" }
        ];

        // Loop garantido exatamente de 1 até 156
        for (let i = 1; i <= 156; i++) {
            productsAneis.push({
                id: i,
                name: `Anel Prata 925 Modelo ${String(i).padStart(3, '0')}`,
                price: 45.00 + ((i % 5) * 5),
                image: `https://via.placeholder.com/400?text=Anel+${String(i).padStart(3, '0')}`
            });
        }

        let cart = [];

        function renderProducts(list, containerId) {
            const grid = document.getElementById(containerId);
            list.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image-container">
                        <span class="badge">Prata 925</span>
                        <img src="${p.image}" alt="${p.name}">
                    </div>
                    <div class="product-info">
                        <div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">R$ ${p.price.toFixed(2).replace('.', ',')}</div>
                        </div>
                        <div>
                            <button class="btn btn-add" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">+ Adicionar</button>
                            <a href="https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent('Olá, gostaria de consultar tamanhos para o item: ' + p.name)}" class="btn btn-consult" target="_blank">Consultar</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        renderProducts(productsAneis, 'grid-aneis');
        renderProducts(productsArgolas, 'grid-argolas');

        function addToCart(id, name, price) {
            cart.push({ id, name, price });
            updateCart();
        }

        function updateCart() {
            const count = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-count').innerText = `${count} item(ns) selecionado(s)`;
            document.getElementById('cart-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function sendOrder(e) {
            e.preventDefault();
            if (cart.length === 0) {
                alert("Selecione pelo menos um item.");
                return;
            }
            let msg = "Olá! Gostaria de fazer o seguinte pedido:\n\n";
            cart.forEach((item, index) => {
                msg += `${index + 1}. ${item.name} - R$ ${item.price.toFixed(2).replace('.', ',')}\n`;
            });
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            msg += `\nTotal: R$ ${total.toFixed(2).replace('.', ',')}`;
            
            window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
