      { id: 81, nome: "Coração na Plaquinha Prata 925", preco: 74.99, categoria: "Aneis", img: "https://i.ibb.co/zVMX9Zkx/IMG-1320.jpg" }
    ];

    // JUNTAR TUDO
    produtos.push(...produtosParte2);

    let carrinho = [];
    let categoriaAtual = 'todos';

    function renderizar() {
      const filtrados = categoriaAtual === 'todos' 
        ? produtos 
        : produtos.filter(p => p.categoria === categoriaAtual);

      document.getElementById('grid').innerHTML = filtrados.map(p => `
        <div class="card">
          <div>
            <img src="${p.img}" alt="${p.nome}" onclick="abrirZoom('${p.img}')">
            <p>${p.nome}</p>
          </div>
          <div>
            <p style="color:#25d366; font-weight:bold;">${p.preco === 0 ? 'Preço sob consulta' : 'R$ ' + p.preco.toFixed(2).replace('.', ',')}</p>
            <button class="btn-add" onclick="adicionar(${p.id})">Adicionar</button>
          </div>
        </div>
      `).join('');
    }

    function filtrar(cat, btn) {
      categoriaAtual = cat;
      document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('ativo'));
      btn.classList.add('ativo');
      renderizar();
    }

    function abrirZoom(urlImg) {
      document.getElementById('img-zoom-conteudo').src = urlImg;
      document.getElementById('modal-zoom').style.display = 'flex';
    }

    function fecharZoom() {
      document.getElementById('modal-zoom').style.display = 'none';
    }

    function adicionar(id) {
      const p = produtos.find(item => item.id === id);
      const existe = carrinho.find(i => i.id === id);
      if(existe) { existe.qtd++; } else { carrinho.push({...p, qtd:1}); }
      atualizar();
    }

    function alterar(id, delta) {
      const i = carrinho.find(item => item.id === id);
      i.qtd += delta;
      if(i.qtd <= 0) carrinho = carrinho.filter(x => x.id !== id);
      atualizar();
    }

    function atualizar() {
      document.getElementById('itens').innerHTML = carrinho.map(i => `
        <div class="item">
          <span>${i.nome}</span>
          <div style="display:flex; align-items:center; gap:10px;">
            <button onclick="alterar(${i.id}, -1)" style="padding:2px 8px; background:#444; color:#fff; border:none; cursor:pointer;">-</button>
            <span>${i.qtd}</span>
            <button onclick="alterar(${i.id}, 1)" style="padding:2px 8px; background:#444; color:#fff; border:none; cursor:pointer;">+</button>
          </div>
        </div>
      `).join('') || '<p style="color:#777; text-align:center;">Seu carrinho está vazio</p>';
      
      const total = carrinho.reduce((acc, i) => acc + (i.preco * i.qtd), 0);
      document.getElementById('total').innerText = total.toFixed(2).replace('.', ',');
      document.getElementById('count').innerText = carrinho.reduce((acc, i) => acc + i.qtd, 0);
    }

    function finalizar() {
      let msg = "Gostaria de pedir: " + carrinho.map(i => `${i.qtd}x ${i.nome}`).join(', ');
      window.open("https://wa.me/5561981642480?text=" + encodeURIComponent(msg));
    }

    renderizar();
  </script>
</body>
